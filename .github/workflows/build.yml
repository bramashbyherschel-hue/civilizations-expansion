name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and package mod
        run: gradle --no-daemon build
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: civilizations-expansion-jar
          path: build/libs/*.jar
          if-no-files-found: error
